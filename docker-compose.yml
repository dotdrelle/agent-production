services:
  production-mcp:
    build: .
    volumes:
      - ${WIKI_WORKSPACE_PATH:?Set WIKI_WORKSPACE_PATH}:/workspace
    environment:
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - WORKSPACE_NAME=${WORKSPACE_NAME:-workspace}
      - WIKI_WORKSPACE_PATH=/workspace
      - WIKI_CONFIG_PATH=${WIKI_CONFIG_PATH:-}
      - WIKI_IMPORTS=${WIKI_IMPORTS:-}
      - PRODUCTION_IMPORT_PATH_MAPPINGS=${PRODUCTION_IMPORT_PATH_MAPPINGS:-}
      - PRODUCTION_ALLOWED_STEPS=${PRODUCTION_ALLOWED_STEPS:-doctor,copy,ingest,ingest_plan,ingest_apply,build,export,polish,restore,pipeline}
      - PRODUCTION_REQUIRE_CONFIRMATION=${PRODUCTION_REQUIRE_CONFIRMATION:-true}
      # Parallelism: effective concurrency ≈ recommendedConcurrency. Intermediate
      # defaults (4/8); low profile 2/4, high profile 8/16. The LLM backend must
      # accept this many concurrent requests. See the manager configuration docs.
      - PRODUCTION_RECOMMENDED_CONCURRENCY=${PRODUCTION_RECOMMENDED_CONCURRENCY:-4}
      - PRODUCTION_MAX_CONCURRENCY=${PRODUCTION_MAX_CONCURRENCY:-8}
      - PRODUCTION_JOBS_DIR=${PRODUCTION_JOBS_DIR:-/workspace/.wiki/production-jobs}
      - PRODUCTION_LOCKS_DIR=${PRODUCTION_LOCKS_DIR:-/workspace/.wiki/production-jobs/locks}
    ports:
      - "${PRODUCTION_MCP_PORT:-3336}:8080"
    restart: unless-stopped
